# Deliberately weak TLS front end — ECDAT demo target A (SPEC.md §14).
#
# Every line here is a finding. Two of them differ in kind, and the difference
# is the whole point of the drift check:
#
#   * `ssl_protocols` below really does enable TLS 1.0 and 1.1. The network
#     probe observes that on the wire — a fact, `source_layer: live`.
#   * openssl.cnf in this same directory *declares* a TLS 1.2 floor. That is a
#     claim, `source_layer: config`, and it is not true of this server.
#
# A config-only audit reads openssl.cnf and passes this host. A probe-only scan
# sees TLS 1.0 and cannot say whether anyone intended it. Running both and
# comparing them is what produces the alignment note.

user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  128;
}

http {
    access_log  off;
    server_tokens  on;

    server {
        # The listen port is half of the alignment asset key: the probe target
        # the user types (host:8443) joins against the server block declaring
        # this port. §9 requires that join to come from the user's input, never
        # from guessing at file contents.
        listen       8443 ssl;
        server_name  legacy.ecdat.demo;

        ssl_certificate      /etc/nginx/certs/weak.crt;   # RSA-1024 / SHA-1
        ssl_certificate_key  /etc/nginx/certs/weak.key;

        # ECDAT-EXPECT: tls-legacy-protocols
        # RFC 8996 deprecated both TLS 1.0 and TLS 1.1 in March 2021. Note the
        # absence of TLSv1.3: this host cannot negotiate it, which is what makes
        # the advisor's ML-KEM recommendation `blocked` rather than recommended.
        ssl_protocols  TLSv1 TLSv1.1 TLSv1.2;

        # ECDAT-EXPECT: weak-cipher-suites
        # CBC-with-SHA1 suites and 3DES (64-bit block — SWEET32, CVE-2016-2183).
        # @SECLEVEL=0 is what makes OpenSSL 1.1.1 willing to serve them, and to
        # serve the 1024-bit SHA-1 certificate alongside them.
        ssl_ciphers  'AES128-SHA:AES256-SHA:DES-CBC3-SHA:AES128-SHA256:HIGH:MEDIUM:@SECLEVEL=0';

        # ECDAT-EXPECT: no-server-cipher-preference
        # The client picks the suite. The probe records this as the server not
        # enforcing its own ordering (§7.5).
        ssl_prefer_server_ciphers  off;

        ssl_session_cache    shared:SSLWEAK:1m;
        ssl_session_tickets  on;

        location / {
            default_type  text/plain;
            return 200 "ecdat demo: legacy TLS endpoint (weak on purpose)\n";
        }
    }
}
