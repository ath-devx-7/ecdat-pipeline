# Correctly configured TLS front end — ECDAT demo target B (SPEC.md §14).
#
# The report needs green as well as red. Two things this host demonstrates:
#
#   1. Zero hygiene findings and zero alignment notes. What the config declares
#      is what the probe observes, so §9 emits nothing for it. An empty drift
#      panel for this host is the correct answer, not a missing one.
#   2. It is still `quantum_vulnerable`. X25519 key agreement and the ECDSA
#      P-256 certificate both fall to Shor's algorithm. "Modern TLS" and
#      "post-quantum ready" are not the same claim, and a tool that shows this
#      host as clean is hiding the entire problem it was built to find.

user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  128;
}

http {
    access_log  off;
    server_tokens  off;

    server {
        listen       8444 ssl;
        server_name  modern.ecdat.demo;

        ssl_certificate      /etc/nginx/certs/strong.crt;  # ECDSA P-256 / SHA-256
        ssl_certificate_key  /etc/nginx/certs/strong.key;

        # TLS 1.3 only. The probe must record TLS 1.0 here as explicitly
        # offered-and-refused, not as absent — §7.5 draws that distinction
        # because "no result" could equally mean the host was unreachable.
        ssl_protocols  TLSv1.3;

        # TLS 1.3 suites are set through the OpenSSL ciphersuites API, not
        # `ssl_ciphers`. Declared here and nowhere else so the declaration and
        # the handshake cannot disagree.
        ssl_conf_command  Ciphersuites  TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

        ssl_prefer_server_ciphers  on;
        ssl_ecdh_curve  X25519:prime256v1;

        ssl_session_cache    shared:SSLSTRONG:1m;
        ssl_session_tickets  off;

        location / {
            default_type  text/plain;
            return 200 "ecdat demo: modern TLS endpoint (clean, still quantum-vulnerable)\n";
        }
    }
}
