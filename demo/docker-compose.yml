# ECDAT demo environment (SPEC.md §14).
#
# Targets to scan, built before any collector, because a certificate parser
# cannot be tested without a bad certificate and a drift check cannot be tested
# without a server that contradicts its own config.
#
#   docker compose -f demo/docker-compose.yml up --build
#
# Everything here is deliberately broken except nginx-strong. See README.md in
# this directory for the finding each target is expected to produce.
#
# Ports published on the host, because the backend runs outside this network and
# probe targets are typed in by the user as host:port:
#
#   8443  nginx-weak    TLS 1.0/1.1/1.2, RSA-1024 SHA-1 cert   <- drift target
#   8444  nginx-strong  TLS 1.3 only, ECDSA P-256 cert         <- the green one
#   8081  pyapp         billing service, keeps the container up
name: ecdat-demo

services:
  # Generates demo/certs/ before anything tries to serve it. OpenSSL 1.1.1 signs
  # SHA-1 and 1024-bit RSA without argument; some 3.x distribution builds refuse
  # SHA-1 outright, which is why cert generation happens in here rather than on
  # whatever OpenSSL the host happens to ship.
  #
  # Runs to completion and exits. Existing certificates are left alone, so
  # bringing the stack up twice does not swap the material under a scan.
  certgen:
    build: ./oldssl
    image: ecdat-demo/oldssl:1.1.1
    command: ["/bin/sh", "/gen_certs.sh", "/certs"]
    volumes:
      - ./gen_certs.sh:/gen_certs.sh:ro
      - ./certs:/certs

  # Target A — the drift host. Config claims a TLS 1.2 floor, server accepts
  # TLS 1.0. Both halves ship in ./weak-nginx.
  nginx-weak:
    build: ./weak-nginx
    image: ecdat-demo/nginx-weak:1.20
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
    restart: unless-stopped

  # Target B — the correctly configured host. Zero hygiene findings, zero
  # alignment notes, and still quantum-vulnerable.
  nginx-strong:
    build: ./strong-nginx
    image: ecdat-demo/nginx-strong:1.27
    ports:
      - "8444:8444"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
    restart: unless-stopped

  # Target C — weak crypto in Python source.
  pyapp:
    build: ./pyapp
    image: ecdat-demo/pyapp:0.1
    ports:
      - "8081:8081"
    restart: unless-stopped

  # Target D — weak crypto in Java source, plus a java.security declaration.
  javaapp:
    build: ./javaapp
    image: ecdat-demo/javaapp:0.1
    restart: unless-stopped

  # Target F — the OpenSSL 1.1.1 host. Exists so the advisor has something to
  # fail a `requires: openssl>=3.5` check against, and doubles as the demo's
  # TLS 1.0 client, since an OpenSSL 3.5 client on the host refuses TLS 1.0 as
  # firmly as a 3.5 server would.
  oldssl:
    build: ./oldssl
    image: ecdat-demo/oldssl:1.1.1
    restart: unless-stopped

  # Target G — the compiled binary. Copies itself out to ./cbin/build on start
  # so the host-side file scan has an ELF to read, then stays resident.
  cbin:
    build: ./cbin
    image: ecdat-demo/cbin:0.1
    volumes:
      - ./cbin/build:/out
    restart: unless-stopped
