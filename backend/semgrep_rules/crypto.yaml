# ECDAT code-scan rules — SPEC.md §7.1, build step 11.
#
# Loaded by app/collectors/code.py, and only from this file: the collector never
# fetches a registry ruleset, because the scan path makes no network calls (§1).
#
# Languages covered: Python, Java, C, Go, JavaScript and TypeScript. The
# collector's CODE_EXTENSIONS list is wider than that on purpose, so a rule added
# here for a new language needs no code change — and `validate_rule_coverage`
# logs a warning at startup naming every extension this file leaves uncovered,
# because a file sent to Semgrep and matched against nothing is spend with no
# coverage and no way to notice.
#
# THESE RULES INVENTORY; THEY DO NOT JUDGE
#
# A rule reports what it SAW — `hashlib.sha256`, `AES/GCM/NoPadding`, an RSA key
# of 2048 bits — whatever its strength. Deciding that MD5 is broken and SHA-256 is
# safe is the policy engine's job (§10), against a cited entry, and an RSA-2048
# key that the rules never recorded is a quantum-vulnerable asset the roadmap
# never saw. So the hash rule matches every digest, the key-generation rule
# captures every size, and the cipher rule captures every transformation.
# Resolving the spelling to a family is the normalizer's job (§8).
#
# HOW CAPTURED VALUES REACH THE COLLECTOR
#
# Semgrep without a login omits `metavars` and `lines` from its JSON output, but
# it still interpolates metavariables into `message`. So every rule that needs a
# captured value writes it into the message as `ecdat|key=$VAR|...`, and the
# collector parses that. The keys:
#
#   algorithm       the spelling to record as algorithm_name
#   transformation  a Java "ALG/MODE/PADDING" string; split by the collector
#   key_size        an integer
#   cipher          the cipher a hardcoded key was handed to (evidence only)
#   declared        a value a call DECLARES rather than uses — an OpenSSL cipher
#                   string handed to set_ciphers, a `ciphers:` option. Kept as
#                   evidence beside a static `algorithm` naming the knob, the
#                   way §7.4 records a config declaration that names no concrete
#                   suite: the finding is about the declaration, and splitting
#                   the string into suites is the config collector's job on a
#                   file it can attribute
#   literal         a matched string literal — must be the LAST field, and the
#                   collector never stores it; it computes entropy and drops it
#
# Static values live in `metadata.ecdat`:
#
#   algorithm         literal spelling when the pattern fixes it
#   algorithm_prefix  prepended to a captured `algorithm` (`algorithms.` so the
#                     finding reads `algorithms.TripleDES`, as the source does)
#   algorithm_in      the complete set of spellings a captured `algorithm` may
#                     take. A capture outside it is DROPPED rather than recorded.
#                     Needed wherever a rule captures a name it does not fully
#                     control: a metavariable-regex bounds what Semgrep MATCHES,
#                     not what it interpolates into the message, and the two
#                     differ for an aliased import (see app/collectors/code.py).
#                     Every spelling listed must have an entry in
#                     policy/algorithm_aliases.yaml — a test enforces that, so a
#                     rule cannot move a finding from absent to unknown.
#   primitive         hash | cipher | signature | key_exchange | protocol
#   mode              ECB, CBC — when the pattern itself fixes the mode
#   observation       tag stored in evidence_raw
#   confidence        overrides §7.1's default of high
#   min_entropy / min_length
#                     the collector's post-filter for string literals; strings
#                     as YAML because Semgrep rejects floats in metadata

rules:

  # ------------------------------------------------------------------------- #
  # Python — hashlib, cryptography.hazmat
  # ------------------------------------------------------------------------- #

  - id: ecdat.python.hashlib
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$H
    patterns:
      - pattern-either:
          - pattern: hashlib.$H(...)
          - pattern: hashlib.new("$H", ...)
      - metavariable-regex:
          metavariable: $H
          regex: ^(md5|md4|sha1|sha224|sha256|sha384|sha512|sha3_224|sha3_256|sha3_384|sha3_512|blake2b|blake2s|ripemd160)$
    metadata:
      ecdat: { algorithm_prefix: "hashlib.", primitive: hash, observation: hash_call }

  - id: ecdat.python.cipher
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$ALG
    patterns:
      - pattern: algorithms.$ALG(...)
      # The ECB rule below records that call with its mode; recording the
      # constructor a second time would put "AES, safe" beside "AES-ECB, broken".
      - pattern-not-inside: Cipher(algorithms.$ALG(...), modes.ECB(...), ...)
    metadata:
      ecdat: { algorithm_prefix: "algorithms.", primitive: cipher, observation: cipher_constructor }

  - id: ecdat.python.ecb-mode
    languages: [python]
    severity: WARNING
    message: ecdat|algorithm=$ALGO
    pattern: Cipher(algorithms.$ALGO(...), modes.ECB(...), ...)
    metadata:
      ecdat: { algorithm_prefix: "algorithms.", primitive: cipher, mode: ECB, observation: ecb_mode }

  - id: ecdat.python.rsa-keygen
    languages: [python]
    severity: INFO
    message: ecdat|key_size=$N
    pattern: rsa.generate_private_key(..., key_size=$N, ...)
    metadata:
      ecdat: { algorithm: RSA, observation: rsa_keygen }

  - id: ecdat.python.ec-keygen
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$CURVE
    pattern: ec.generate_private_key(ec.$CURVE(), ...)
    metadata:
      ecdat: { observation: ec_keygen }

  - id: ecdat.python.ecdh
    languages: [python]
    severity: INFO
    message: ecdat
    pattern: ec.ECDH()
    metadata:
      ecdat: { algorithm: ECDH, primitive: key_exchange, observation: key_agreement }

  - id: ecdat.python.dh-parameters
    languages: [python]
    severity: INFO
    message: ecdat|key_size=$N
    pattern: dh.generate_parameters(..., key_size=$N, ...)
    metadata:
      ecdat: { algorithm: DH, primitive: key_exchange, observation: dh_parameter_generation }

  # The padding is a property of an RSA operation, not a second algorithm, so it
  # is recorded under its own spelling and left to the alias table to fold back
  # onto RSA. PKCS1v15 is the one asked for; OAEP and PSS are matched by the same
  # rule because a padding scheme nobody recorded is a padding scheme nobody can
  # compare the PKCS1v15 count against.
  - id: ecdat.python.rsa-padding
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$P
    patterns:
      - pattern: padding.$P(...)
      - metavariable-regex:
          metavariable: $P
          regex: ^(PKCS1v15|OAEP|PSS)$
    metadata:
      ecdat: { algorithm_prefix: "padding.", observation: rsa_padding }

  # pycryptodome. The import is required rather than assumed: `DES.new(key)` on
  # its own is a name this rule has no reason to believe is a cipher.
  #
  # `algorithm_in` is the whole module list, not a shortlist of weak ones — §7.1
  # says the rules inventory rather than judge, and an AES use the roadmap never
  # saw is the failure this file exists to prevent. It is exhaustive so that
  # `Crypto.Cipher.<anything>` cannot reach the store under a family the alias
  # table has never heard of.
  - id: ecdat.python.pycryptodome-cipher
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern-either:
      - pattern: Crypto.Cipher.$ALG.new(...)
      - patterns:
          - pattern-inside: |
              from Crypto.Cipher import $ALG
              ...
          - pattern: $ALG.new(...)
    metadata:
      ecdat:
        algorithm_prefix: "Crypto.Cipher."
        primitive: cipher
        observation: cipher_constructor
        algorithm_in:
          [AES, ARC2, ARC4, Blowfish, CAST, ChaCha20, ChaCha20_Poly1305, DES,
           DES3, PKCS1_OAEP, PKCS1_v1_5, Salsa20, _EKSBlowfish]

  - id: ecdat.python.pycryptodome-rsa-keygen
    languages: [python]
    severity: INFO
    message: ecdat|key_size=$N
    pattern-either:
      - pattern: Crypto.PublicKey.RSA.generate($N, ...)
      - patterns:
          - pattern-inside: |
              from Crypto.PublicKey import RSA
              ...
          - pattern: RSA.generate($N, ...)
    metadata:
      ecdat: { algorithm: RSA, observation: rsa_keygen }

  - id: ecdat.python.ssl-protocol
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$P
    patterns:
      - pattern: ssl.$P
      - metavariable-regex:
          metavariable: $P
          regex: ^PROTOCOL_[A-Za-z0-9_]+$
    metadata:
      ecdat: { primitive: protocol, observation: protocol_declared }

  - id: ecdat.python.ssl-set-ciphers
    languages: [python]
    severity: INFO
    message: ecdat|declared=$C
    pattern: $CTX.set_ciphers("$C")
    metadata:
      ecdat: { algorithm: set_ciphers, primitive: cipher, observation: cipher_selection_declared }

  - id: ecdat.python.hmac
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$D
    pattern-either:
      - pattern: hmac.new(..., digestmod=hashlib.$D, ...)
      - pattern: hmac.new($K, $M, hashlib.$D)
    metadata:
      ecdat: { algorithm_prefix: "hashlib.", primitive: hash, observation: mac_call }

  - id: ecdat.python.hmac-named
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$D
    pattern-either:
      - pattern: hmac.new(..., digestmod="$D", ...)
      - pattern: hmac.new($K, $M, "$D")
    metadata:
      ecdat: { primitive: hash, observation: mac_call }

  - id: ecdat.python.hardcoded-key-literal
    languages: [python]
    severity: WARNING
    message: ecdat|cipher=$ALG
    patterns:
      - pattern-either:
          - pattern: algorithms.$ALG(b"...", ...)
          - pattern: algorithms.$ALG("...", ...)
    metadata:
      ecdat: { algorithm: hardcoded-key-material, observation: hardcoded_key, confidence: high }

  - id: ecdat.python.hardcoded-key-named
    languages: [python]
    severity: WARNING
    message: ecdat
    patterns:
      - pattern: $NAME = b"..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|token|passw).*
    metadata:
      ecdat: { algorithm: hardcoded-key-material, observation: hardcoded_key, confidence: medium }

  - id: ecdat.python.high-entropy-literal
    languages: [python]
    severity: INFO
    message: ecdat|literal=$S
    patterns:
      - pattern: $NAME = "$S"
      - metavariable-regex:
          metavariable: $S
          regex: ^.{20,}$
    metadata:
      ecdat: { algorithm: high-entropy-string-literal, observation: high_entropy_literal, confidence: medium, min_entropy: "4.5", min_length: "20" }

  # ------------------------------------------------------------------------- #
  # Java — JCA
  # ------------------------------------------------------------------------- #

  - id: ecdat.java.message-digest
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern: MessageDigest.getInstance("$ALG", ...)
    metadata:
      ecdat: { primitive: hash, observation: hash_call }

  - id: ecdat.java.mac
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern: Mac.getInstance("$ALG", ...)
    metadata:
      ecdat: { primitive: hash, observation: mac_call }

  - id: ecdat.java.cipher
    languages: [java]
    severity: INFO
    message: ecdat|transformation=$T
    pattern: Cipher.getInstance("$T", ...)
    metadata:
      ecdat: { primitive: cipher, observation: cipher_constructor }

  - id: ecdat.java.key-generator
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern: KeyGenerator.getInstance("$ALG", ...)
    metadata:
      ecdat: { primitive: cipher, observation: symmetric_keygen }

  - id: ecdat.java.signature
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern: Signature.getInstance("$ALG", ...)
    metadata:
      ecdat: { primitive: signature, observation: signature_call }

  - id: ecdat.java.key-agreement
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern: KeyAgreement.getInstance("$ALG", ...)
    metadata:
      ecdat: { primitive: key_exchange, observation: key_agreement }

  - id: ecdat.java.keypair-generator
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG|key_size=$N
    patterns:
      - pattern-inside: |
          KeyPairGenerator $KPG = KeyPairGenerator.getInstance("$ALG", ...);
          ...
      - pattern: $KPG.initialize($N, ...)
    metadata:
      ecdat: { observation: keypair_generation }

  # The rule above needs an `initialize` call to fire, so a generator whose size
  # is left at the provider default produced nothing at all. This one covers
  # exactly that case and no other: `pattern-not-inside` keeps a sized generator
  # from being reported twice, once with its size and once without.
  - id: ecdat.java.keypair-generator-unsized
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    patterns:
      - pattern: KeyPairGenerator.getInstance("$ALG", ...)
      - pattern-not-inside: |
          KeyPairGenerator $KPG = KeyPairGenerator.getInstance("$ALG", ...);
          ...
          $KPG.initialize(...);
    metadata:
      ecdat: { observation: keypair_generation }

  - id: ecdat.java.ssl-context
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$P
    pattern: SSLContext.getInstance("$P", ...)
    metadata:
      ecdat: { primitive: protocol, observation: protocol_declared }

  # An enabled-protocol list is a positive declaration, so it is enumerated one
  # version per finding — the same rule §7.4 applies to `ssl_protocols`, and for
  # the same reason: §9 flags diverging usage sites, and one row covering three
  # versions cannot be diverged from in part.
  - id: ecdat.java.enabled-protocols
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$P
    patterns:
      - pattern-inside: $SOCKET.setEnabledProtocols(...);
      - pattern: '"$P"'
    metadata:
      ecdat: { primitive: protocol, observation: protocol_version_declared }

  - id: ecdat.java.enabled-cipher-suites
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$S
    patterns:
      - pattern-inside: $SOCKET.setEnabledCipherSuites(...);
      - pattern: '"$S"'
    metadata:
      ecdat: { primitive: cipher, observation: cipher_suite_declared }

  - id: ecdat.java.hardcoded-key-named
    languages: [java]
    severity: WARNING
    message: ecdat
    patterns:
      - pattern-either:
          - pattern: String $NAME = "...";
          - pattern: byte[] $NAME = "...".getBytes(...);
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|token|passw).*
    metadata:
      ecdat: { algorithm: hardcoded-key-material, observation: hardcoded_key, confidence: medium }

  - id: ecdat.java.hardcoded-key-spec
    languages: [java]
    severity: WARNING
    message: ecdat
    pattern: new SecretKeySpec("...".getBytes(...), ...)
    metadata:
      ecdat: { algorithm: hardcoded-key-material, observation: hardcoded_key, confidence: high }

  - id: ecdat.java.high-entropy-literal
    languages: [java]
    severity: INFO
    message: ecdat|literal=$S
    patterns:
      - pattern: String $NAME = "$S";
      - metavariable-regex:
          metavariable: $S
          regex: ^.{20,}$
    metadata:
      ecdat: { algorithm: high-entropy-string-literal, observation: high_entropy_literal, confidence: medium, min_entropy: "4.5", min_length: "20" }

  # ------------------------------------------------------------------------- #
  # C — OpenSSL's libcrypto API
  # ------------------------------------------------------------------------- #

  - id: ecdat.c.digest
    languages: [c]
    severity: INFO
    message: ecdat|algorithm=$F
    patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(MD5_Init|MD5|EVP_md5|MD4_Init|MD4|EVP_md4|SHA1_Init|SHA1|EVP_sha1|SHA224_Init|SHA224|EVP_sha224|SHA256_Init|SHA256|EVP_sha256|SHA384_Init|SHA384|EVP_sha384|SHA512_Init|SHA512|EVP_sha512)$
    metadata:
      ecdat: { primitive: hash, observation: hash_call }

  - id: ecdat.c.cipher
    languages: [c]
    severity: INFO
    message: ecdat|algorithm=$F
    patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(DES_ecb_encrypt|DES_ncbc_encrypt|DES_cbc_encrypt|DES_ede3_cbc_encrypt|DES_ede3_ecb_encrypt|DES_set_key|DES_set_key_checked|DES_set_key_unchecked|RC4|RC4_set_key|EVP_des_ecb|EVP_des_cbc|EVP_des_ede3_cbc|EVP_rc4|EVP_aes_128_ecb|EVP_aes_256_ecb|EVP_aes_128_cbc|EVP_aes_256_cbc|EVP_aes_128_gcm|EVP_aes_256_gcm|EVP_chacha20|EVP_chacha20_poly1305)$
    metadata:
      ecdat: { primitive: cipher, observation: cipher_call }

  - id: ecdat.c.rsa-keygen
    languages: [c]
    severity: INFO
    message: ecdat|key_size=$N
    pattern-either:
      - pattern: RSA_generate_key_ex($R, $N, ...)
      - pattern: RSA_generate_key($N, ...)
    metadata:
      ecdat: { algorithm: RSA, observation: rsa_keygen }

  - id: ecdat.c.dh
    languages: [c]
    severity: INFO
    message: ecdat
    pattern-either:
      - pattern: DH_new(...)
      - pattern: DH_generate_parameters_ex(...)
    metadata:
      ecdat: { algorithm: DH, primitive: key_exchange, observation: dh_parameter_generation }

  # The NID is the spelling OpenSSL uses for a curve; the alias table folds it
  # onto the curve's own name, the way it already folds `prime256v1`.
  - id: ecdat.c.ec-curve
    languages: [c]
    severity: INFO
    message: ecdat|algorithm=$NID
    pattern: EC_KEY_new_by_curve_name($NID)
    metadata:
      ecdat: { observation: curve_selected }

  - id: ecdat.c.cipher-list
    languages: [c]
    severity: INFO
    message: ecdat|declared=$C
    pattern: SSL_CTX_set_cipher_list($CTX, "$C")
    metadata:
      ecdat: { algorithm: SSL_CTX_set_cipher_list, primitive: cipher, observation: cipher_selection_declared }

  - id: ecdat.c.min-proto-version
    languages: [c]
    severity: INFO
    message: ecdat|algorithm=$V
    pattern: SSL_CTX_set_min_proto_version($CTX, $V)
    metadata:
      ecdat: { primitive: protocol, observation: protocol_floor }

  # ------------------------------------------------------------------------- #
  # Go — the standard library's crypto/* packages
  #
  # The spelling recorded is the import path (`crypto/md5`), not the constructor
  # (`md5.New`), because the package is the identity the alias table can resolve
  # and the constructor is already visible in the evidence snippet. The one
  # exception is triple DES, which shares `crypto/des` with single DES and would
  # otherwise be reported as the wrong algorithm.
  # ------------------------------------------------------------------------- #

  - id: ecdat.go.hash
    languages: [go]
    severity: INFO
    message: ecdat|algorithm=$PKG
    patterns:
      - pattern-either:
          - pattern: $PKG.New(...)
          - pattern: $PKG.Sum(...)
          - pattern: $PKG.Sum224(...)
          - pattern: $PKG.Sum256(...)
          - pattern: $PKG.Sum384(...)
          - pattern: $PKG.Sum512(...)
          - pattern: $PKG.New224(...)
          - pattern: $PKG.New512_256(...)
          - pattern: $PKG.Sum512_256(...)
      - metavariable-regex:
          metavariable: $PKG
          regex: ^(md5|sha1|sha256|sha512)$
    metadata:
      ecdat: { algorithm_prefix: "crypto/", primitive: hash, observation: hash_call }

  - id: ecdat.go.cipher
    languages: [go]
    severity: INFO
    message: ecdat|algorithm=$PKG
    patterns:
      - pattern: $PKG.NewCipher(...)
      - metavariable-regex:
          metavariable: $PKG
          regex: ^(des|rc4|aes)$
    metadata:
      ecdat: { algorithm_prefix: "crypto/", primitive: cipher, observation: cipher_constructor }

  - id: ecdat.go.triple-des
    languages: [go]
    severity: INFO
    message: ecdat
    pattern: des.NewTripleDESCipher(...)
    metadata:
      ecdat:
        algorithm: crypto/des.NewTripleDESCipher
        primitive: cipher
        observation: cipher_constructor

  - id: ecdat.go.rsa-keygen
    languages: [go]
    severity: INFO
    message: ecdat|key_size=$N
    pattern: rsa.GenerateKey($RAND, $N)
    metadata:
      ecdat: { algorithm: crypto/rsa, observation: rsa_keygen }

  # rsa is deliberately absent from the regex: the rule above already records it
  # with its key size, and a second row would double-count one key.
  - id: ecdat.go.asymmetric-keygen
    languages: [go]
    severity: INFO
    message: ecdat|algorithm=$PKG
    patterns:
      - pattern-either:
          - pattern: $PKG.GenerateKey(...)
          - pattern: $PKG.GenerateParameters(...)
      - metavariable-regex:
          metavariable: $PKG
          regex: ^(ecdsa|ed25519|dsa|ecdh)$
    metadata:
      ecdat: { algorithm_prefix: "crypto/", observation: keypair_generation }

  - id: ecdat.go.curve
    languages: [go]
    severity: INFO
    message: ecdat|algorithm=$CURVE
    patterns:
      - pattern: elliptic.$CURVE()
      - metavariable-regex:
          metavariable: $CURVE
          regex: ^P(224|256|384|521)$
    metadata:
      ecdat: { observation: curve_selected }

  - id: ecdat.go.tls-min-version
    languages: [go]
    severity: INFO
    message: ecdat|algorithm=$V
    pattern: "tls.Config{..., MinVersion: tls.$V, ...}"
    metadata:
      ecdat: { primitive: protocol, observation: protocol_floor }

  # Scoped to the CipherSuites field rather than to `tls.TLS_*` anywhere, so a
  # constant named in a comparison is not reported as a suite the server offers.
  - id: ecdat.go.tls-cipher-suites
    languages: [go]
    severity: INFO
    message: ecdat|algorithm=$SUITE
    patterns:
      - pattern-inside: "tls.Config{..., CipherSuites: $SUITES, ...}"
      - pattern: tls.$SUITE
      - metavariable-regex:
          metavariable: $SUITE
          regex: ^TLS_[A-Z0-9_]+$
    metadata:
      ecdat: { primitive: cipher, observation: cipher_suite_declared }

  # ------------------------------------------------------------------------- #
  # JavaScript and TypeScript — node's crypto, tls and https
  #
  # Every rule lists both languages: a `js` rule is not applied to a `.ts` file,
  # and the two halves of a project are the same codebase.
  # ------------------------------------------------------------------------- #

  - id: ecdat.js.hash
    languages: [js, ts]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern-either:
      - pattern: crypto.createHash("$ALG", ...)
      - pattern: crypto.createHmac("$ALG", ...)
    metadata:
      ecdat: { primitive: hash, observation: hash_call }

  - id: ecdat.js.cipher
    languages: [js, ts]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern-either:
      - pattern: crypto.createCipheriv("$ALG", ...)
      - pattern: crypto.createDecipheriv("$ALG", ...)
    metadata:
      ecdat: { primitive: cipher, observation: cipher_constructor }

  - id: ecdat.js.keypair-generator
    languages: [js, ts]
    severity: INFO
    message: ecdat|algorithm=$ALG|key_size=$N
    pattern-either:
      - pattern: 'crypto.generateKeyPair("$ALG", {..., modulusLength: $N, ...}, ...)'
      - pattern: 'crypto.generateKeyPairSync("$ALG", {..., modulusLength: $N, ...}, ...)'
    metadata:
      ecdat: { observation: keypair_generation }

  - id: ecdat.js.keypair-generator-unsized
    languages: [js, ts]
    severity: INFO
    message: ecdat|algorithm=$ALG
    patterns:
      - pattern-either:
          - pattern: crypto.generateKeyPair("$ALG", ...)
          - pattern: crypto.generateKeyPairSync("$ALG", ...)
      - pattern-not: 'crypto.generateKeyPair("$ALG", {..., modulusLength: $N, ...}, ...)'
      - pattern-not: 'crypto.generateKeyPairSync("$ALG", {..., modulusLength: $N, ...}, ...)'
    metadata:
      ecdat: { observation: keypair_generation }

  # `secureProtocol` and `ciphers` are node's TLS option names and appear in the
  # options object handed to tls.connect, tls.createServer, https.request and
  # new https.Agent. The object is matched rather than the call, because the
  # options are as often built into a variable first as written inline.
  - id: ecdat.js.tls-secure-protocol
    languages: [js, ts]
    severity: INFO
    message: ecdat|algorithm=$P
