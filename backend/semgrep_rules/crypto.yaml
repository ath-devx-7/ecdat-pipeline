# ECDAT code-scan rules — SPEC.md §7.1, build step 11.
#
# Loaded by app/collectors/code.py, and only from this file: the collector never
# fetches a registry ruleset, because the scan path makes no network calls (§1).
#
# THESE RULES INVENTORY; THEY DO NOT JUDGE
#
# A rule reports what it SAW — `hashlib.sha256`, `AES/GCM/NoPadding`, an RSA key
# of 2048 bits — whatever its strength. Deciding that MD5 is broken and SHA-256 is
# safe is the policy engine's job (§10), against a cited entry, and an RSA-2048
# key that the rules never recorded is a quantum-vulnerable asset the roadmap
# never saw. So the hash rule matches every digest, the key-generation rule
# captures every size, and the cipher rule captures every transformation.
# Resolving the spelling to a family is the normalizer's job (§8).
#
# HOW CAPTURED VALUES REACH THE COLLECTOR
#
# Semgrep without a login omits `metavars` and `lines` from its JSON output, but
# it still interpolates metavariables into `message`. So every rule that needs a
# captured value writes it into the message as `ecdat|key=$VAR|...`, and the
# collector parses that. The keys:
#
#   algorithm       the spelling to record as algorithm_name
#   transformation  a Java "ALG/MODE/PADDING" string; split by the collector
#   key_size        an integer
#   cipher          the cipher a hardcoded key was handed to (evidence only)
#   literal         a matched string literal — must be the LAST field, and the
#                   collector never stores it; it computes entropy and drops it
#
# Static values live in `metadata.ecdat`:
#
#   algorithm         literal spelling when the pattern fixes it
#   algorithm_prefix  prepended to a captured `algorithm` (`algorithms.` so the
#                     finding reads `algorithms.TripleDES`, as the source does)
#   primitive         hash | cipher | signature | key_exchange
#   mode              ECB, CBC — when the pattern itself fixes the mode
#   observation       tag stored in evidence_raw
#   confidence        overrides §7.1's default of high
#   min_entropy / min_length
#                     the collector's post-filter for string literals; strings
#                     as YAML because Semgrep rejects floats in metadata

rules:

  # ------------------------------------------------------------------------- #
  # Python — hashlib, cryptography.hazmat
  # ------------------------------------------------------------------------- #

  - id: ecdat.python.hashlib
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$H
    patterns:
      - pattern-either:
          - pattern: hashlib.$H(...)
          - pattern: hashlib.new("$H", ...)
      - metavariable-regex:
          metavariable: $H
          regex: ^(md5|md4|sha1|sha224|sha256|sha384|sha512|sha3_224|sha3_256|sha3_384|sha3_512|blake2b|blake2s|ripemd160)$
    metadata:
      ecdat: { algorithm_prefix: "hashlib.", primitive: hash, observation: hash_call }

  - id: ecdat.python.cipher
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$ALG
    patterns:
      - pattern: algorithms.$ALG(...)
      # The ECB rule below records that call with its mode; recording the
      # constructor a second time would put "AES, safe" beside "AES-ECB, broken".
      - pattern-not-inside: Cipher(algorithms.$ALG(...), modes.ECB(...), ...)
    metadata:
      ecdat: { algorithm_prefix: "algorithms.", primitive: cipher, observation: cipher_constructor }

  - id: ecdat.python.ecb-mode
    languages: [python]
    severity: WARNING
    message: ecdat|algorithm=$ALGO
    pattern: Cipher(algorithms.$ALGO(...), modes.ECB(...), ...)
    metadata:
      ecdat: { algorithm_prefix: "algorithms.", primitive: cipher, mode: ECB, observation: ecb_mode }

  - id: ecdat.python.rsa-keygen
    languages: [python]
    severity: INFO
    message: ecdat|key_size=$N
    pattern: rsa.generate_private_key(..., key_size=$N, ...)
    metadata:
      ecdat: { algorithm: RSA, observation: rsa_keygen }

  - id: ecdat.python.ec-keygen
    languages: [python]
    severity: INFO
    message: ecdat|algorithm=$CURVE
    pattern: ec.generate_private_key(ec.$CURVE(), ...)
    metadata:
      ecdat: { observation: ec_keygen }

  - id: ecdat.python.hardcoded-key-literal
    languages: [python]
    severity: WARNING
    message: ecdat|cipher=$ALG
    patterns:
      - pattern-either:
          - pattern: algorithms.$ALG(b"...", ...)
          - pattern: algorithms.$ALG("...", ...)
    metadata:
      ecdat: { algorithm: hardcoded-key-material, observation: hardcoded_key, confidence: high }

  - id: ecdat.python.hardcoded-key-named
    languages: [python]
    severity: WARNING
    message: ecdat
    patterns:
      - pattern: $NAME = b"..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|token|passw).*
    metadata:
      ecdat: { algorithm: hardcoded-key-material, observation: hardcoded_key, confidence: medium }

  - id: ecdat.python.high-entropy-literal
    languages: [python]
    severity: INFO
    message: ecdat|literal=$S
    patterns:
      - pattern: $NAME = "$S"
      - metavariable-regex:
          metavariable: $S
          regex: ^.{20,}$
    metadata:
      ecdat: { algorithm: high-entropy-string-literal, observation: high_entropy_literal, confidence: medium, min_entropy: "4.5", min_length: "20" }

  # ------------------------------------------------------------------------- #
  # Java — JCA
  # ------------------------------------------------------------------------- #

  - id: ecdat.java.message-digest
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern: MessageDigest.getInstance("$ALG", ...)
    metadata:
      ecdat: { primitive: hash, observation: hash_call }

  - id: ecdat.java.mac
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern: Mac.getInstance("$ALG", ...)
    metadata:
      ecdat: { primitive: hash, observation: mac_call }

  - id: ecdat.java.cipher
    languages: [java]
    severity: INFO
    message: ecdat|transformation=$T
    pattern: Cipher.getInstance("$T", ...)
    metadata:
      ecdat: { primitive: cipher, observation: cipher_constructor }

  - id: ecdat.java.key-generator
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern: KeyGenerator.getInstance("$ALG", ...)
    metadata:
      ecdat: { primitive: cipher, observation: symmetric_keygen }

  - id: ecdat.java.signature
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern: Signature.getInstance("$ALG", ...)
    metadata:
      ecdat: { primitive: signature, observation: signature_call }

  - id: ecdat.java.key-agreement
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG
    pattern: KeyAgreement.getInstance("$ALG", ...)
    metadata:
      ecdat: { primitive: key_exchange, observation: key_agreement }

  - id: ecdat.java.keypair-generator
    languages: [java]
    severity: INFO
    message: ecdat|algorithm=$ALG|key_size=$N
    patterns:
      - pattern-inside: |
          KeyPairGenerator $KPG = KeyPairGenerator.getInstance("$ALG", ...);
          ...
      - pattern: $KPG.initialize($N, ...)
    metadata:
      ecdat: { observation: keypair_generation }

  - id: ecdat.java.hardcoded-key-named
    languages: [java]
    severity: WARNING
    message: ecdat
    patterns:
      - pattern-either:
          - pattern: String $NAME = "...";
          - pattern: byte[] $NAME = "...".getBytes(...);
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|token|passw).*
    metadata:
      ecdat: { algorithm: hardcoded-key-material, observation: hardcoded_key, confidence: medium }

  - id: ecdat.java.hardcoded-key-spec
    languages: [java]
    severity: WARNING
    message: ecdat
    pattern: new SecretKeySpec("...".getBytes(...), ...)
    metadata:
      ecdat: { algorithm: hardcoded-key-material, observation: hardcoded_key, confidence: high }

  - id: ecdat.java.high-entropy-literal
    languages: [java]
    severity: INFO
    message: ecdat|literal=$S
    patterns:
      - pattern: String $NAME = "$S";
      - metavariable-regex:
          metavariable: $S
          regex: ^.{20,}$
    metadata:
      ecdat: { algorithm: high-entropy-string-literal, observation: high_entropy_literal, confidence: medium, min_entropy: "4.5", min_length: "20" }

  # ------------------------------------------------------------------------- #
  # C — OpenSSL's libcrypto API
  # ------------------------------------------------------------------------- #

  - id: ecdat.c.digest
    languages: [c]
    severity: INFO
    message: ecdat|algorithm=$F
    patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(MD5_Init|MD5|EVP_md5|MD4_Init|MD4|EVP_md4|SHA1_Init|SHA1|EVP_sha1|SHA224_Init|SHA224|EVP_sha224|SHA256_Init|SHA256|EVP_sha256|SHA384_Init|SHA384|EVP_sha384|SHA512_Init|SHA512|EVP_sha512)$
    metadata:
      ecdat: { primitive: hash, observation: hash_call }

  - id: ecdat.c.cipher
    languages: [c]
    severity: INFO
    message: ecdat|algorithm=$F
    patterns:
      - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(DES_ecb_encrypt|DES_ncbc_encrypt|DES_cbc_encrypt|DES_ede3_cbc_encrypt|DES_ede3_ecb_encrypt|RC4|RC4_set_key|EVP_des_ecb|EVP_des_cbc|EVP_des_ede3_cbc|EVP_rc4|EVP_aes_128_ecb|EVP_aes_256_ecb|EVP_aes_128_cbc|EVP_aes_256_cbc|EVP_aes_128_gcm|EVP_aes_256_gcm|EVP_chacha20|EVP_chacha20_poly1305)$
    metadata:
      ecdat: { primitive: cipher, observation: cipher_call }

  - id: ecdat.c.rsa-keygen
    languages: [c]
    severity: INFO
    message: ecdat|key_size=$N
    pattern-either:
      - pattern: RSA_generate_key_ex($R, $N, ...)
      - pattern: RSA_generate_key($N, ...)
    metadata:
      ecdat: { algorithm: RSA, observation: rsa_keygen }
