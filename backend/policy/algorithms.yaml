# Policy engine lookup table (SPEC.md §6, §10). Pure lookup — no heuristics.
#
# Every entry MUST carry a `source` citation. The loader rejects any entry
# without one, naming the offending id.
#
# broken_now and quantum_vulnerable are INDEPENDENT classifications, not two
# points on one severity scale. RSA-4096 is quantum_vulnerable and perfectly
# secure today; MD5 is broken today and irrelevant to quantum.
#
# AES and SHA-256 are quantum_safe. Grover weakens symmetric crypto, it does
# not break it. Never classify them quantum_vulnerable.
entries:
  - id: md5-hash
    family: MD5
    oid: "1.2.840.113549.2.5"
    primitive: hash
    verdict: broken_now
    source: "NIST SP 800-131A Rev.2"

  - id: sha1-signature
    family: SHA-1
    primitive: signature
    verdict: broken_now
    source: "NIST SP 800-131A Rev.2"

  - id: rsa-weak-key
    family: RSA
    condition: { key_size_lt: 2048 }
    verdict: broken_now
    source: "NIST SP 800-131A Rev.2"

  - id: rsa-quantum
    family: RSA
    primitive: [key_exchange, signature]
    verdict: quantum_vulnerable
    source: "NIST IR 8547"

  # RSA whose use was not observed — a key from a generator, a public key with
  # no context. Shor's algorithm factors the modulus whatever the key is for, so
  # the verdict does not depend on the primitive; only the wave does, and step 9
  # sends an unobserved primitive to `verify` rather than guessing. Without this
  # entry every RSA-2048 key generation in a codebase was `unknown`, which is
  # the wrong answer to a question the pack can answer.
  - id: rsa-quantum-any-use
    family: RSA
    verdict: quantum_vulnerable
    source: "NIST IR 8547"

  - id: ecc-quantum
    family: [ECDSA, ECDH, EdDSA]
    verdict: quantum_vulnerable
    source: "NIST IR 8547"

  # Finite-field Diffie-Hellman and DSA. Shor breaks the discrete logarithm as
  # readily as it breaks factoring, so leaving these out while ruling on ECDH and
  # ECDSA would not be a deliberate gap — it would be an omission, and one the
  # pack already contradicts: `pqc_targets.yaml`'s `kex-to-mlkem` names DH as a
  # migration target, which is hard to square with having no verdict on it.
  # The demo's sshd_config declares two of these (diffie-hellman-group1-sha1,
  # group14-sha1) and they are exactly what the finding is about.
  - id: dh-dsa-quantum
    family: [DH, DSA]
    verdict: quantum_vulnerable
    source: "NIST IR 8547"

  - id: aes-safe
    family: AES
    condition: { key_size_gte: 128 }
    verdict: quantum_safe
    source: "NIST IR 8547"

  # SPEC.md §6 requires SHA-256 to resolve to quantum_safe and §16 tests for it.
  # Grover halves the preimage work against a hash the way it halves the key
  # search against a cipher — SHA-256 is weakened, not broken, and there is no
  # reading of that under which it is quantum_vulnerable. SHA-384 and SHA-512
  # ride along because the same paragraph of the same citation covers them, and
  # a pack that answered "unknown" for the stronger member of a family it has
  # already ruled on would be answering a question it knows.
  - id: sha2-safe
    family: [SHA-256, SHA-384, SHA-512]
    verdict: quantum_safe
    source: "NIST IR 8547"

  # The algorithms NIST standardised to replace the vulnerable ones. An imported
  # CBOM may already list one (demo/README.md §I), and a pack that could not call
  # its own migration targets safe would leave the readiness percentage with no
  # numerator.
  - id: pqc-fips-safe
    family: [ML-KEM, ML-DSA, SLH-DSA]
    verdict: quantum_safe
    source: "NIST FIPS 203, 204 and 205"

  # ------------------------------------------------------------------------- #
  # Hygiene — observations that are not algorithms but were assessed all the
  # same. The collectors emit these under their own marker names (§7.1, §7.3,
  # §7.4). Without an entry here each one fell to `unknown`, which inflated the
  # unassessed count with findings the tool understood perfectly well. A
  # hygiene verdict gets no wave (§12) and no migration target (§11): it is a
  # thing to fix, not a thing to migrate.
  # ------------------------------------------------------------------------- #

  - id: hardcoded-key-material
    family: hardcoded-key-material
    verdict: hygiene
    source: "CWE-321 Use of Hard-coded Cryptographic Key; OWASP Cryptographic Storage Cheat Sheet"

  - id: high-entropy-literal
    family: high-entropy-string-literal
    verdict: hygiene
    source: "CWE-798 Use of Hard-coded Credentials"

  - id: private-key-on-disk
    family: [private-key-file, private-key-world-readable]
    verdict: hygiene
    source: "NIST SP 800-57 Part 1 Rev.5 §6.1"

  - id: certificate-validity
    family: [certificate-expired, certificate-expiring]
    verdict: hygiene
    source: "RFC 5280 §4.1.2.5"

  - id: certificate-self-signed
    family: certificate-self-signed
    verdict: hygiene
    source: "RFC 5280 §6.1"

  - id: tls-server-preference
    family: tls-no-server-cipher-preference
    verdict: hygiene
    source: "RFC 9325 §4.1"

  - id: aes-ecb
    family: AES
    condition: { mode: ECB }
    verdict: broken_now
    source: "OWASP Cryptographic Storage Cheat Sheet"

  - id: tls-legacy
    family: TLS
    condition: { protocol_version_lt: "1.2" }
    verdict: broken_now
    source: "RFC 8996"
